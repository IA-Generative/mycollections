[pytest]
testpaths = tests
pythonpath = .
markers =
    e2e: parcours de bout en bout contre une cible réelle (tests/e2e, E2E_BASE_URL)
    captures: produit des captures d'écran de chaque écran (E2E_CAPTURES)
    banc: banc des assistants (scripts/banc.py) : planificateurs comparés sans réseau ni base
