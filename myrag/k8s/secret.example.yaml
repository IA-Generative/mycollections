apiVersion: v1
kind: Secret
metadata:
  name: myrag-secrets
  namespace: myrag
type: Opaque
stringData:
  # OpenRAG VM bearer token.
  OPENRAG_ADMIN_TOKEN: "CHANGE_ME"
  # Keycloak confidential client (server-to-server admin API).
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
  # Optional: Legifrance PISTE API for Legifrance ingest source.
  LEGIFRANCE_CLIENT_ID: ""
  LEGIFRANCE_CLIENT_SECRET: ""
  # Keycloak confidential client 'mycollections-drive' (service account,
  # client_credentials grant) — used to mint a Bearer token for the Drive API.
  DRIVE_CLIENT_SECRET: "CHANGE_ME"
  # NOTE: DATABASE_URL is NOT stored here. It is composed at pod-start from
  # owui-socle-secrets.POSTGRES_USER/POSTGRES_PASSWORD in deployment-backend.yaml.
  # Jeton de la passerelle MirAI pour la génération de questions (docs/generation.md). PROPRE à
  # Mes collections : la passerelle compte son quota par jeton. Absent ⇒ routes de génération en 503.
  MYCOLLECTIONS_GENERATION_LLM_CLE: "CHANGE_ME"
