# Fiche d'essai de la campagne (docs/campagne-recherche.md) : données inventées, publiques.
# Les sources sont des ALIAS : le fichier privé CAMPAGNE_CORRESPONDANCE donne leur identifiant sur la cible.
# Variante s2 : régimes, rangs et consignes métier (Algériens, contentieux avec relais, pièces).
assistant: e2e-camp-sejour-s2
titre: Essai — Séjour des étrangers (consignes)
rubrique: droit-etrangers
description: 'Assistant d''essai de la campagne : régimes, rangs et consignes métier (Algériens, contentieux, pièces).'
sources:
  - {id: guide, type: collection, regime: toujours, rang: 1}
  - {id: faq, type: collection, regime: selon_question, rang: 2}
  - {id: guide-md, type: collection, regime: selon_question, rang: 3}
  - {id: mobilite, type: collection, regime: selon_question, rang: 4}
  - {id: jurisprudence, type: collection, regime: sur_consigne, rang: 5}
consignes:
  - id: juridique
    quand: toujours
    repondre: Citer le texte applicable (article du CESEDA ou de l'accord) avant toute explication.
  # Avec le sac de mots (sans modèle d'embeddings), une consigne est reconnue par les MOTS qu'une
  # question partage avec son « quand » ou l'un de ses exemples : des exemples courts, faits des mots
  # propres au cas, la déclenchent ; une phrase complète la déclenche aussi sur des mots communs à
  # tout le domaine (« titre de séjour », « marié à une Française »).
  - id: algeriens
    quand: 'la personne est algérienne : accord franco-algérien de 1968, certificat de résidence algérien'
    exemples: [algérien, algérienne, accord franco-algérien, certificat de résidence algérien]
    chercher:
      - {source: guide}
      - {source: guide-md}
    repondre: >-
      Si les passages citent l'accord franco-algérien, citer son article d'abord, puis celui du CESEDA
      s'il s'applique ; sinon, répondre avec le CESEDA et signaler que l'accord peut prévoir autre chose.
      Lister les pièces quand les passages les donnent.
  - id: contentieux
    quand: un recours au tribunal contre un refus, une OQTF ou une interdiction de retour
    exemples: [refus, recours, tribunal, tribunaux, OQTF, contester, annuler une décision, ce qu'a jugé le tribunal]
    chercher:
      - {source: guide}
      - {source: jurisprudence, avec: article_trouve}
    repondre: Citer l'article du CESEDA en cause, puis les décisions (juridiction, numéro, date).
  - id: pieces
    quand: les pièces justificatives et les démarches pour constituer un dossier
    exemples: [pièces à fournir, justificatifs, constituer un dossier, démarches, ANEF]
    chercher:
      - {source: faq}
      - {source: guide}
      - {source: guide-md}
    repondre: Lister les pièces telles que les documents les donnent, sans en inventer.
