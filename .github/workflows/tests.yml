# Tests unitaires, à chaque pull request et sur main. Aucun secret : la suite de bout en bout
# (myrag/tests/e2e) s'ignore d'elle-même sans E2E_BASE_URL, elle se joue depuis un poste.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myrag
    steps:
      - uses: actions/checkout@v4
      # Les dépendances sont tenues par uv (pyproject.toml + uv.lock), comme dans l'image.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: myrag/uv.lock
      - run: uv sync --frozen
      - run: uv run python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myrag/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: myrag/frontend/package-lock.json
      - run: npm ci
      # .nuxt/tsconfig.json, que tsconfig.json étend : sans lui vitest ne transforme rien.
      - run: npx nuxi prepare
      - run: npx vitest run
