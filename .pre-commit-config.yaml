repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-json
      - id: check-toml
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty (advisoire)
        language: system
        entry: bash -c 'cd myrag && uv run ty check --exit-zero --output-format concise'
        pass_filenames: false
        types_or: [python, pyi]
        verbose: true
  - repo: local
    hooks:
      - id: client-format
        name: Client format (npm, advisoire)
        entry: bash -c 'if [ "$#" -eq 0 ]; then exit 0; fi; cd myrag/frontend && npx eslint --fix "${@#myrag/frontend/}" || true; git add "${@#myrag/frontend/}"'
        language: system
        types_or: [javascript, ts, tsx, vue]
        files: ^myrag/frontend/
        exclude: ^myrag/frontend/(\.nuxt|\.output|dist|node_modules)/
  - repo: local
    hooks:
      - id: client-type-check
        name: Client type check (npm, advisoire)
        entry: bash -c 'cd myrag/frontend && npm run type-check || true'
        language: system
        types_or: [javascript, ts, tsx, vue]
        files: ^myrag/frontend/
        exclude: ^myrag/frontend/(\.nuxt|\.output|dist|node_modules)/
        pass_filenames: false
